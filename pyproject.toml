[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "techwitness"
dynamic = ["version"]
description = "Identifies the technologies behind a website from banners, headers, HTML, JavaScript, links, cookies and TLS, with evidence for each one"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Isaac E. Louzeiro" }]
keywords = ["security", "pentest", "recon", "fingerprinting", "technology-detection", "banner-grabbing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]

[project.scripts]
techwitness = "techwitness.cli:main"

[project.urls]
Homepage = "https://github.com/IsaacLouzeiro/techwitness"
Issues = "https://github.com/IsaacLouzeiro/techwitness/issues"
Changelog = "https://github.com/IsaacLouzeiro/techwitness/blob/main/CHANGELOG.md"

[tool.setuptools]
packages = ["techwitness"]

[tool.setuptools.dynamic]
version = { attr = "techwitness.__version__" }
